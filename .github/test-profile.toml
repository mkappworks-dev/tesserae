opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasm-encoder]
opt-level = 3
[profile.dev.package.wasm-metadata]
opt-level = 3
[profile.dev.package.wasmprinter]
