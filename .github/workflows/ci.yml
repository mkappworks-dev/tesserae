name: CI

on:
  pull_request:
    branches: [main]
  # A PR's run goes stale when a sibling merges first; these catch what it missed.
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # bevy links alsa, udev, wayland and xkbcommon on Linux. Wayland is a
      # default bevy feature and wayland-sys resolves wayland-client through
      # pkg-config at build time, so a missing -dev package fails the build
      # rather than degrading to X11. macOS needs none of this, which is why
      # it only ever shows up here.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path games/demo/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      # RUSTFLAGS does not reach rustdoc, so a broken intra-doc link needs its own.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --all-features

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Prettier
        run: npm ci

      - name: Check formatting of docs and config
        run: npm run fmt:check

  boundaries:
    name: Boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Demo uses only the WIT contract
        run: ./scripts/check-demo-boundary

      # Invariant 3 in docs/architecture.md. tesserae-core and tesserae-mods stay
      # headless so every expensive algorithm is testable and benchmarkable; a
      # transitive bevy or wgpu edge silently ends that.
      #
      # `cargo tree -p` exits non-zero for a package the workspace does not have,
      # so a crate that is missing is skipped; tesserae-core going missing means
      # the check itself is broken, so that one is required.
      - name: No engine dependency in headless crates
        run: |
          set -euo pipefail
          members=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          for crate in tesserae-core tesserae-mods; do
            if ! grep -qxF "$crate" <<< "$members"; then
              if [ "$crate" = tesserae-core ]; then
                echo "::error::tesserae-core is not a workspace member, so the boundary check cannot run"
                exit 1
              fi
              echo "$crate does not exist yet, skipping"
              continue
            fi
            if cargo tree -p "$crate" --edges normal --prefix none \
                 | grep -qE '^(bevy|wgpu)'; then
              echo "::error::$crate must not depend on bevy or wgpu — see docs/architecture.md invariant 3"
              cargo tree -p "$crate" --edges normal --prefix none | grep -E '^(bevy|wgpu)'
              exit 1
            fi
          done

  deny:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Advisories plus a licence policy: a copyleft dependency cannot ship in a
      # BSL-licensed binary, so catch it at the PR rather than at release.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # tesserae-mods' tests load Mods compiled to WASM components. Each guest is
      # its own workspace root, so without a shared target dir wit-bindgen
      # recompiles 22 times and rust-cache saves none of it.
      - name: Build test guests and demo Game
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/wasm-guests
        run: |
          rustup target add wasm32-wasip2
          ./scripts/build-guests

      # The workspace manifest builds dependencies at opt-level 3 so a local
      # debug run of a Bevy app is not an order of magnitude too slow. CI never
      # runs the app — it runs about 1,300 unit tests — so that setting buys
      # nothing here and costs a full LLVM pass over ~600 crates. The glob
      # matches dependencies only, so our own crates keep [profile.dev]'s
      # opt-level 1.
      #
      # Flags must match across the build, run and doctest steps so they share
      # one set of fingerprints. tesserae-core is the one workspace crate whose
      # tests are CPU-bound (property and brute-force meshing and LOD checks),
      # so it alone is optimised.
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build tests
        run: |
          cargo nextest run --workspace --locked --features tesserae/dev \
            --config 'profile.dev.package."*".opt-level=0' \
            --config 'profile.dev.package.tesserae-core.opt-level=3' --no-run

      - name: Run tests
        run: |
          cargo nextest run --workspace --locked --features tesserae/dev \
            --config 'profile.dev.package."*".opt-level=0' \
            --config 'profile.dev.package.tesserae-core.opt-level=3'

      # nextest does not run doctests.
      - name: Run doctests
        run: |
          cargo test --doc --workspace --locked --features tesserae/dev \
            --config 'profile.dev.package."*".opt-level=0' \
            --config 'profile.dev.package.tesserae-core.opt-level=3'

  benches:
    name: Benches
    runs-on: ubuntu-latest
    # Its own job: the opt-level 3 wasmtime build it needs shares nothing with
    # Test's opt-level 0 one, so running it there only adds to the critical path.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The mesher is the hot path; a bench that no longer compiles is a bench
      # nobody runs. This does not measure, it only builds.
      #
      # `--exclude tesserae` rather than `--workspace` alone: the Bevy app has no
      # benches, but cargo still builds its binary in the bench profile, which
      # means compiling the whole Bevy tree a second time at release
      # optimisation in a job that has already compiled it once. Excluding by
      # name rather than naming tesserae-core keeps future headless crates, such
      # as tesserae-mods, covered automatically.
      - name: Build benches
        run: cargo bench --workspace --exclude tesserae --no-run --locked

  build:
    name: Build
    runs-on: ubuntu-latest
    # Deliberately not `needs: [test, boundaries]`. Gating saved runner minutes
    # on a red PR, but it serialised the two slowest jobs: wall clock was test
    # plus build rather than the larger of the two. Build is also a required
    # status check and there is no merge queue configured, so it cannot be moved
    # off pull requests — running it in parallel is the only lever left.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: tesserae-linux-x86_64
          path: target/release/tesserae
          retention-days: 7
