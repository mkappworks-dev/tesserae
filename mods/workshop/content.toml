# Four legs under a thick top. A body collides with the whole cell, so nothing snags between the
# legs.
[[shapes]]
name = "table"
boxes = [
  { min = [1, 0, 1], max = [4, 12, 4] },
  { min = [12, 0, 1], max = [15, 12, 4] },
  { min = [1, 0, 12], max = [4, 12, 15] },
  { min = [12, 0, 12], max = [15, 12, 15] },
  { min = [0, 12, 0], max = [16, 16, 16] },
]
collision = [{ min = [0, 0, 0], max = [16, 16, 16] }]

