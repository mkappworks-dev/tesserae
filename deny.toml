# cargo-deny policy. A copyleft dependency cannot ship inside a BSL-licensed
# binary, so the licence list is the load-bearing half of this file.

[advisories]
yanked = "deny"
# Narrows only the "unmaintained" class to crates one of our own crates depends
# on directly; vulnerabilities still fail anywhere in the graph. Bevy brings
# ~600 transitive crates, and an unmaintained advisory on one of them is Bevy's
# to resolve — our only move would be to add another id to an ignore list.
unmaintained = "workspace"
ignore = [
  # A decompression bomb in a zstd decoder. Bevy 0.20 pins ruzstd ^0.8 and the
  # fix is only in 0.9.1, so a lockfile bump cannot reach it. The decoder reads
  # KTX2 supercompression, and the only KTX2 in this build is Bevy's own embedded
  # tonemapping and SMAA tables, so no untrusted input reaches it. Remove this
  # when Bevy moves to ruzstd >= 0.9.1, or when a Mod can supply a texture.
  # Tracked in .scratch/2026-10-13-ruzstd-advisory/.
  { id = "RUSTSEC-2026-0344", reason = "ruzstd only decodes Bevy's embedded KTX2 tables; fix needs a Bevy bump" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  # MIT without the attribution clause, so strictly more permissive than MIT
  # above. Reaches us through encase, under bevy_render.
  "MIT-0",
]
confidence-threshold = 0.9

# Our own crates are the BSL-licensed work, not third-party code linked into it,
# so the list above — which exists to keep copyleft out of the binary — does not
# describe them. Scoped per crate rather than allowed globally, so a third-party
# BUSL dependency is still rejected.
[[licenses.exceptions]]
name = "tesserae"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "tesserae-core"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "tesserae-mods"
allow = ["BUSL-1.1"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
