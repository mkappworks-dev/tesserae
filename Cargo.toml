[workspace]
resolver = "3"
members = ["crates/tesserae", "crates/tesserae-core", "crates/tesserae-mods"]
# A Game compiles to wasm32-wasip2, so a root `cargo build` must not try to build
# it for the host, and so does a test guest of tesserae-mods. See
# docs/adr/0004-demo-game-in-repo-real-game-out.md.
exclude = ["games/demo", "crates/tesserae-mods/tests/guests"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "BUSL-1.1"

# Without this a debug build of a Bevy app runs an order of magnitude slower than
# it should, which reads as "the engine is slow" rather than "the build is
# unoptimised".
[profile.dev]
opt-level = 1
# Full debuginfo made each Bevy target/ 15-25 GB; line tables keep backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
