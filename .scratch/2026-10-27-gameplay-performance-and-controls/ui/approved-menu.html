:root{--font-sans:Aileron,sans-serif;--font-mono:Aileron,sans-serif}

:root{--hot:color-mix(in srgb,var(--chart-2) 78%,var(--foreground));--hot-bg:color-mix(in srgb,var(--hot) 12%,transparent);--soft:color-mix(in srgb,var(--foreground) 5%,transparent);--line:var(--border)}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:3px}button{border:1px solid var(--line);border-radius:6px;background:var(--secondary);padding:9px 13px;min-height:38px;transition:background .15s,border-color .15s}button:hover{background:var(--accent)}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--hot);border-color:var(--hot);color:var(--background);font-weight:650}button.ghost{background:transparent}button.selected{border-color:var(--hot);background:var(--hot-bg);color:var(--hot)}button.small{padding:5px 9px;min-height:32px;font-size:12px}h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:-.6px}h2{font-size:17px;letter-spacing:-.3px}h3{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted-foreground)}.muted{color:var(--muted-foreground)}.smalltext{font-size:12px;line-height:1.5}.mono,kbd{font-family:var(--font-mono)}kbd{font-size:11px;background:var(--code-background);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:3px 6px;white-space:nowrap}.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:1.8px}.mark{display:grid;grid-template-columns:repeat(2,5px);gap:2px;transform:rotate(-12deg)}.mark i{width:5px;height:5px;background:var(--hot)}.brand small{font:11px var(--font-sans);font-weight:400;letter-spacing:0;color:var(--muted-foreground)}
.app{position:relative;display:flex;flex-direction:column;min-height:722px}.app.in-game{min-height:0}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:0 0 17px;border-bottom:1px solid var(--line)}.nav{display:flex;gap:4px}.nav button{border-color:transparent;background:transparent;font-size:13px;padding:8px 12px}.nav button.active{background:var(--hot-bg);color:var(--hot);border-color:color-mix(in srgb,var(--hot) 40%,transparent)}.back{font-size:12px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 20px}.heading p{font-size:12px;line-height:1.5;margin-top:6px}.pill{font-size:10px;text-transform:uppercase;letter-spacing:1px;border:1px solid var(--line);border-radius:12px;padding:5px 9px;white-space:nowrap;color:var(--muted-foreground)}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:17px}.tabs button{border:none;border-radius:0;background:none;padding:5px 0 12px;color:var(--muted-foreground);font-size:13px}.tabs button.active{color:var(--foreground);box-shadow:0 2px 0 var(--hot)}.body{height:424px;overflow:auto;padding:2px 3px 2px 0;scrollbar-color:var(--muted-foreground) transparent;scrollbar-width:thin}.group{border:1px solid var(--line);padding:16px;border-radius:var(--radius);background:var(--card);margin-bottom:14px}.group h3{margin-bottom:5px}.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none;padding-bottom:1px}.label{font-size:13px;font-weight:550}.description{font-size:11px;color:var(--muted-foreground);line-height:1.5;margin-top:4px;max-width:330px}.segmented{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:7px;flex-shrink:0}.segmented button{min-height:31px;padding:5px 10px;border-color:transparent;background:none;font-size:12px;white-space:nowrap}.segmented button.selected{background:var(--hot-bg);color:var(--hot) </style></head><body><main><div class="studybar" id="studybar"></div><section class="app" id="app"></section><section class="brandboard" id="brandboard"></section><section class="paletteboard" id="paletteboard"></section></main>
<script>
const app=document.getElementById('app');
const markPaths='<path d="M2 6 6 2h6v10H2Z"/><path d="M14 2h10v10H14Z"/><path d="M26 2h6l4 4v6H26Z"/><path d="M14 14h10v10H14Z"/><path d="M14 26h10v6l-4 4h-6Z"/>';

let accent='leaf',detailPinned=false,hovered=null,dragged=null,lastView='',resumeFocus=null;
const mineral='color-mix(in srgb,var(--chart-2) 78%,var(--foreground))';
const leaf='color-mix(in srgb,var(--success) 76%,var(--warning))';
const forest='color-mix(in srgb,var(--success) 43%,var(--background))';
const forestInk='color-mix(in srgb,'+forest+' 54%,var(--foreground))';
const moss='color-mix(in srgb,color-mix(in srgb,var(--success) 60%,var(--warning)) 72%,var(--muted-foreground))';
const palettes={
moss:{name:'Moss green',base:moss,color:moss,on:'var(--background)',reason:'Muted and natural, with enough warmth to sit comfortably beside stone and wood.'},
leaf:{name:'Leaf green',base:leaf,color:leaf,on:'var(--background)',reason:'Chosen direction: fresh, distinctive and clear against the dark interface.'},
forest:{name:'Forest green',base:forest,color:forestInk,on:'var(--foreground)',reason:'A dark green base, with a lighter tint for readable text and focus on dark surfaces.'},
mineral:{name:'Mineral teal',base:mineral,color:mineral,on:'var(--background)',reason:'The cooler alternative: crisp, technical and distinct from the warmer greens.'}
};
function mark(size=28,fill='currentColor'){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 38 38" fill="'+fill+'" role="img" aria-label="Tesserae mosaic T">'+markPaths+'</svg>'}
function setAccent(key){accent=key;document.documentElement.style.setProperty('--hot',palettes[key].color);document.documentElement.style.setProperty('--hot-fill',palettes[key].base);document.documentElement.style.setProperty('--hot-on',palettes[key].on);renderStudy();renderBrand();renderPalettes()}
function renderStudy(){document.getElementById('studybar').innerHTML='<span class="study-label">Accent study</span><div class="palette-options">'+Object.entries(palettes).map(([key,p])=>'<button class="palette '+(accent===key?'on':'')+'" style="--swatch:'+p.base+'" onclick="setAccent(\''+key+'\')" aria-pressed="'+(accent===key)+'"><span class="swatch"></span>'+p.name+'</button>').join('')+'</div><span class="preview-only">Design prototype</span>'}
function renderBrand(){document.getElementById('brandboard').innerHTML='<div class="eyebrow">LOGO DIRECTION · MOSAIC T</div><h2>One mark, built from five tiles.</h2><p>Cut corners give the tiles a crafted edge. The gaps keep them distinct; the silhouette still reads as a T.</p><div class="brand-study"><div class="signature">'+mark(70)+'<div><div class="wordmark">Tesserae</div><div class="tagline">Voxel engine</div></div></div><div class="mark-tests"><div class="mark-test">'+mark(16)+'<small>16 px</small></div><div class="mark-test">'+mark(24)+'<small>24 px</small></div><div class="mark-test">'+mark(40)+'<small>One color</small></div><div class="mark-test"><span class="mono-patch">'+mark(28)+'</span><small>Reversed</small></div></div></div><div class="brand-reason"><span><strong>'+palettes[accent].name+'</strong><br>'+palettes[accent].reason+'</span><span><strong>Color has a job</strong><br>Accent for selection and actions. Amber for attention. Material colors stay independent.</span></div>'}
function renderPalettes(){document.getElementById('paletteboard').innerHTML='<h2>Four accents, the same UI rules.</h2><p class="muted smalltext">Outlined buttons and straight tab indicators. Select a color to preview it above.</p><div class="palette-grid">'+Object.entries(palettes).map(([key,p])=>'<button class="palette-card '+(accent===key?'chosen':'')+'" style="--example:'+p.color+';--example-base:'+p.base+';--example-on:'+p.on+'" onclick="setAccent(\''+key+'\')" aria-pressed="'+(accent===key)+'"><span class="color-band">'+mark(27)+'</span><span class="palette-name">'+p.name+'</span><span class="palette-caption">'+(key==='leaf'?'Chosen direction':key==='forest'?'Dark base + light tint':key==='moss'?'Muted and natural':'Cool and technical')+'</span><span class="color-samples"><span class="sample-button">Selected</span><span class="sample-tab">Active tab</span></span></button>').join('')+'</div>'}
function setNumber(key,value){draft[key]=Number(value);render()}
function slider(key){return '<div class="slider"><input type="range" min="25" max="300" step="5" value="'+draft[key]*100+'" aria-label="'+(key==='sensitivity'?'Mouse sensitivity':'Scroll sensitivity')+'" oninput="this.nextElementSibling.textContent=(this.value/100).toFixed(2)+\'×\'" onchange="setNumber(\''+key+'\',this.value/100)"><output>'+draft[key].toFixed(2)+'×</output></div>'}
function toggle(key){return '<button class="switch-control" role="switch" aria-label="Invert vertical look" aria-checked="'+(draft[key]==='On')+'" onclick="set(\''+key+'\',\''+(draft[key]==='On'?'Off':'On')+'\')"><span>'+draft[key]+'</span><span class="switch-track"><span class="switch-knob"></span></span></button>'}
function inspect(i){selected=i;shape='Cube';detailPinned=true;updateDetail();syncTiles()}
function chooseShape(value){outside=true;shape=value;held=selected;detailPinned=true;render()}
function takeDrop(e,n){e.preventDefault();if(dragged!==null)assign(n,dragged,'Cube');dragged=null}
function slotClick(n){if(assigning){assign(n);return}outside=false;slot=n;held=slots[n];selected=held;shape=slotShapes[n];detailPinned=true;render()}

const initial={sprint:'Hold',removal:'Hold',invert:'Off',sensitivity:1,scroll:'Standard',scrollspeed:1,display:'Display synced',cap:'None'};
let outside=false;
let saved={...initial},draft={...saved},page='catalogue',sub='behavior',section='Movement',dialog=null,selected=0,shape='Cube',held=0,slot=0,assigning=false;
const materials=[['Stone','var(--muted-foreground)'],['Brick','var(--destructive)'],['Lamp','var(--warning)'],['Wood','color-mix(in srgb,var(--warning) 55%,var(--background))'],['Leaves','var(--success)'],['Glass','var(--info)'],['Water','var(--chart-2)'],['Fire','var(--chart-3)'],['Ash','var(--muted)']];
const defaults=[
['Move forward','W','','Movement'],['Move backward','S','','Movement'],['Move left','A','','Movement'],['Move right','D','','Movement'],['Ascend','Space','','Movement'],['Descend','Left Ctrl','','Movement'],['Sprint','Left Shift','Right Shift','Movement'],
['Place / ignite','Right mouse','','Building'],['Remove','Left mouse','','Building'],['Sample','Middle mouse','P','Building'],['Empty hand','X','','Building'],['Turn shape','Q','','Building'],['Flip shape','E','','Building'],['Next shape','F','','Building'],
['Open catalogue','Tab','','Interface'],['Open input settings','I','','Interface'],['Release cursor','Esc','','Interface'],['Undo','Ctrl/Cmd + Z','','Interface'],['Redo','Ctrl/Cmd + Shift + Z','Ctrl + Y','Interface']];
let slots=[0,0,0,0,2,3,8,6,7],slotShapes=['Cube','Slab','Stairs','Post','Cube','Cube','Cube','Cube','Cube'];
let savedBindings=defaults.map(x=>[...x]),bindings=savedBindings.map(x=>[...x]);
let lastControls='behavior';
const searches={catalogue:'',bindings:''};
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchesSearch(values,key){const words=searches[key].trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);const text=values.join(' ').toLocaleLowerCase();return words.every(word=>text.includes(word))}
function bindingVisible(r){return searches.bindings.trim()?matchesSearch(r,'bindings'):r[3]===section}
function updateSearch(value){searches[page]=value;render()}
function clearSearch(){searches[page]='';render();app.querySelector('.search-input')?.focus()}
function searchBar(key,count){const label=key==='catalogue'?'Search materials':'Search actions or keys';return '<div class="search-row"><div class="search-field"><span aria-hidden="true">⌕</span><input class="search-input" type="search" aria-label="'+label+'" placeholder="'+label+'…" value="'+escapeHTML(searches[key])+'" oninput="updateSearch(this.value)">'+(searches[key]?b('×','clearSearch()','search-clear','aria-label="Clear search"'):'<kbd>/</kbd>')+'</div><span class="result-count" role="status">'+count+' '+(key==='catalogue'?(count===1?'material':'materials'):(count===1?'action':'actions'))+'</span></div>'}
function emptySearch(){return '<div class="empty-search"><strong>No matches</strong><p>Try another name or clear your search.</p>'+b('Clear search','clearSearch()','ghost small')+'</div>'}
function dirty(){return JSON.stringify(saved)!==JSON.stringify(draft)||JSON.stringify(bindings)!==JSON.stringify(savedBindings)}
function b(text,fn,cls='',extra=''){return '<button class="'+cls+'" onclick="'+fn+'" '+extra+'>'+text+'</button>'}
function cube(index,form='Cube'){return '<div class="voxel '+form.toLowerCase()+'" style="--material:'+materials[index][1]+'"><span class="vtop"></span><span class="vleft"></span><span class="vright"></span></div>'}
function set(k,v){draft[k]=v;render()}
function segment(key,values){return '<div class="segmented">'+values.map(v=>b(v,"set('"+key+"','"+v+"')",draft[key]===v?'selected':'','aria-pressed="'+(draft[key]===v)+'"')).join('')+'</div>'}
function row(title,desc,control){return '<div class="row"><div><div class="label">'+title+'</div><div class="description">'+desc+'</div></div>'+control+'</div>'}
function stepper(key){return '<div class="stepper">'+b('−',"step('"+key+"',-1)",'','aria-label="Decrease '+key+'"')+'<output>'+draft[key].toFixed(2)+'×</output>'+b('+',"step('"+key+"',1)",'','aria-label="Increase '+key+'"')+'</div>'}
function step(key,delta){draft[key]=Math.min(3,Math.max(.25,Math.round((draft[key]+.25*delta)*100)/100));render()}
function nav(target){if(['behavior','bindings'].includes(target))lastControls=target;if(dirty()&&!['behavior','bindings','display'].includes(target)){dialog={type:'unsaved',target};render();return}page=target;dialog=null;render()}
function apply(){saved={...draft};savedBindings=bindings.map(x=>[...x]);dialog=null;render();toast('Settings applied')}
function saveAndGo(){const target=dialog.target;apply();page=target;render()}
function discard(target){draft={...saved};bindings=savedBindings.map(x=>[...x]);page=target;dialog=null;render()}
function restore(){draft={...initial};bindings=defaults.map(x=>[...x]);dialog=null;render()}
function resetAction(i){bindings[i][1]=defaults[i][1];bindings[i][2]=defaults[i][2];render()}
function capture(i,j){resumeFocus='capture('+i+','+j+')';dialog={type:'capture',i,j};render()}
function unbind(i,j){bindings[i][j]='';render()}
function chooseKey(key){const i=dialog.i,j=dialog.j;let clash=null;bindings.forEach((row,n)=>{for(let col=1;col<=2;col++)if(row[col]===key&&(n!==i||col!==j))clash={i:n,j:col}});if(clash){dialog={type:'conflict',i,j,key,clash};render()}else{bindings[i][j]=key;dialog=null;render()}}
function replace(){bindings[dialog.clash.i][dialog.clash.j]='';bindings[dialog.i][dialog.j]=dialog.key;dialog=null;render()}
function toast(text){let el=document.createElement('div');el.className='toast';el.textContent=text;app.appendChild(el);setTimeout(()=>el.remove(),1800)}
function hold(i){outside=true;held=held===i?null:i;selected=i;shape='Cube';detailPinned=true;render()}
function clearSelection(){outside=true;held=null;assigning=false;render()}
function assign(n,material=selected,form=shape){slots[n]=material;slotShapes[n]=form;assigning=false;render();toast(materials[material][0]+' assigned to slot '+(n+1))}
function quickbar(world=false){return '<div class="'+(world?'worldslots':'quickbar')+'">'+(!world?'<div class="quickbar-title"><span>Quick slots</span><span>'+(assigning?'Choose a destination slot':(held===null?'Nothing selected':'Selected: '+materials[held][0]+' · '+shape))+'</span></div>':'')+'<div class="slots">'+slots.map((material,i)=>'<button class="slot '+(!outside&&slot===i?'active':'')+' '+(assigning?'drop-target':'')+'" onclick="slotClick('+i+')" ondragover="event.preventDefault()" ondrop="takeDrop(event,'+i+')" aria-label="Slot '+(i+1)+': '+materials[material][0]+' '+slotShapes[i]+'"><kbd>'+(i+1)+'</kbd>'+cube(material,slotShapes[i])+'</button>').join('')+'</div></div>'}
function render(){
 const view=page+':'+section;
 const scroll=view===lastView?(app.querySelector('.body')?.scrollTop||0):0;
 const active=document.activeElement;
 const focusAction=active?.getAttribute('onclick');
 const focusLabel=active?.getAttribute('aria-label');
 const caret=active?.classList.contains('search-input')?[active.selectionStart,active.selectionEnd]:null;
 lastView=view;
 renderStudy();renderBrand();renderPalettes();app.classList.toggle('in-game',page==='game');
 if(page==='game'){app.innerHTML='<div class="world"><div class="ground"></div><div class="crosshair">+</div><div class="worldhint"><kbd>Tab</kbd> Menu</div>'+quickbar(true)+'</div>';return}
 let html='<header class="top"><div class="brand">'+mark(29)+'<span>Tesserae</span></div><nav class="nav" aria-label="Menu">'+['catalogue','behavior','bindings','display'].map(p=>b(p==='bindings'?'Key bindings':p[0].toUpperCase()+p.slice(1),"nav('"+p+"')",page===p?'active':'')).join('')+'</nav>'+b('Back to game',"nav('game')",'ghost back')+'</header>';
 if(page==='catalogue'){
 html+='<div class="heading"><div><h1>Catalogue</h1><p class="muted">Materials and Shapes for your World.</p></div><span class="pill">9 Materials</span></div>'+searchBar('catalogue',materials.filter(m=>matchesSearch([m[0],'demo:'+m[0]],'catalogue')).length)+'<div class="catalogue"><div class="catalogue-grid">'+materials.map((m,i)=>!matchesSearch([m[0],'demo:'+m[0]],'catalogue')?'':'<div data-material="'+i+'" class="tile '+(held===i?'selected':'')+'"><button class="tile-main" onmouseenter="preview('+i+')" onmouseleave="hovered=null" onfocus="if(this.matches(\':focus-visible\')){inspect('+i+')}" onclick="hold('+i+')" draggable="true" ondragstart="dragged='+i+'" ondragend="dragged=null" aria-label="Select '+m[0]+'">'+cube(i)+'<span>'+m[0]+'</span></button><button class="inspect" onclick="inspect('+i+')" title="Inspect '+m[0]+' and choose a Shape" aria-label="Inspect '+m[0]+'">⋯</button></div>').join('')+(!materials.some(m=>matchesSearch([m[0],'demo:'+m[0]],'catalogue'))?emptySearch():'')+'</div><aside class="detail" id="detail">'+details()+'</aside></div><div class="catalogue-foot">'+quickbar()+'<div class="catalogue-hint"><span>Click to select / clear · X: clear selection · Close menu to place</span><span><kbd>Tab</kbd> close &nbsp; <kbd>Esc</kbd> release cursor</span></div></div>';
 }else{
 html+='<div class="heading"><div><h1>'+(page==='display'?'Display':page==='bindings'?'Key bindings':'Behavior')+'</h1><p class="muted">'+(page==='display'?'Choose frame pacing without changing visual quality.':page==='bindings'?'Find an action and choose up to two bindings.':'Tune how you move, look, and build.')+'</p></div><span class="pill">'+(dirty()?'Unsaved changes':'Saved preferences')+'</span></div>';
 if(page==='bindings')html+=searchBar('bindings',bindings.filter(bindingVisible).length);
 html+='<div class="body">';
 if(page==='display'){
 html+='<div class="group"><h3>Presentation</h3>'+row('Display sync','Match frame presentation to your display.',segment('display',['Display synced','Sync off']))+'<div class="notice '+(draft.display==='Display synced'?'':'warn')+'">'+(draft.display==='Display synced'?'Recommended for normal play. Keeps presentation free of tearing.':'Sync is off. Frames may tear; choose a limit below to reduce unnecessary work.')+'</div><div class="row" style="display:block"><div class="label">Frame rate limit</div><div class="description" style="margin-bottom:12px">An optional ceiling, independent of display sync.</div><div class="caps">'+['None','60','120','144','240','1000'].map(v=>b(v==="None"?'No limit':v,"set('cap','"+v+"')",draft.cap===v?'selected':'')).join('')+'</div></div><div class="policy-summary"><span class="policy-icon">'+(draft.display==='Display synced'?'↔':'↗')+'</span><span>'+(draft.display==='Display synced'?'Display synced':draft.cap==='None'?'Uncapped rendering':'Sync off')+'<span class="description" style="display:block;margin-top:2px">'+(draft.cap==='None'?'No additional frame limit':draft.cap+' FPS ceiling')+'</span></span></div></div><div class="smalltext muted">View distance, textures, shadows, and simulation settings stay unchanged.</div>';
 }else if(page==='behavior'){
 html+='<div class="group"><h3>Movement & building</h3>'+row('Sprint activation',draft.sprint==='Hold'?'Sprint while the binding is held.':'Press once to enable sprint; press again to stop.',segment('sprint',['Hold','Toggle']))+row('Removal activation',draft.removal==='Hold'?'Hold on one target until removal completes.':'Timed removal on one target. A second tap cancels.',segment('removal',['Hold','Timed tap']))+'</div><div class="group"><h3>Mouse & quick slots</h3>'+row('Mouse sensitivity','Relative to the default mouse feel.',slider('sensitivity'))+row('Invert vertical look','Reverse the mouse look direction.',toggle('invert'))+row('Scroll direction',draft.scroll==='Standard'?'Wheel down selects the next quick slot.':'Wheel up selects the next quick slot.',segment('scroll',['Standard','Reversed']))+row('Scroll sensitivity','Higher values move through quick slots faster.',slider('scrollspeed'))+'</div>';
 }else{
 html+=(searches.bindings.trim()?'<div class="search-scope">Searching all categories</div>':'<div class="binding-categories">'+['Movement','Building','Interface'].map(v=>b(v,"section='"+v+"';render()",section===v?'selected small':'small')).join('')+'</div>')+'<div class="smalltext muted" style="margin-bottom:6px">Select a binding to change it. Either alternative activates the action.</div><div class="table-head"><span>Action</span><span>Primary</span><span>Alternative</span><span></span></div>'+bindings.map((r,i)=>!bindingVisible(r)?'':'<div class="bindrow"><span>'+r[0]+(searches.bindings.trim()?'<small class="binding-group-label">'+r[3]+'</small>':'')+'</span>'+[1,2].map(j=>'<div class="binding" data-label="'+(j===1?'Primary':'Alternative')+'">'+b(r[j]||'Add binding','capture('+i+','+j+')',r[j]?'':'empty')+(r[j]?b('×','unbind('+i+','+j+')','clear','aria-label="Clear '+r[0]+' binding"'):'')+'</div>').join('')+b('↺','resetAction('+i+')','reset-row','title="Restore '+r[0]+' defaults" aria-label="Restore '+r[0]+' defaults"')+'</div>').join('');
 if(!bindings.some(bindingVisible))html+=emptySearch();
 }
 html+='</div><footer class="footer '+(dirty()?'dirty':'')+'"><div class="footer-left"><span class="status"><span class="dot"></span>'+(dirty()?'Changes not applied':'No pending changes')+'</span>'+b('Restore defaults',"dialog={type:'reset'};render()",'reset')+'</div><div class="footer-right">'+b('Cancel',"nav('game')",'ghost')+b('Apply changes','apply()','primary',dirty()?'':'disabled')+'</div></footer>';
 }
 if(dialog){
 let modal='';
 if(dialog.type==='capture')modal='<h2>Change binding</h2><p>'+bindings[dialog.i][0]+' · '+(dialog.j===1?'Primary':'Alternative')+'</p><div class="capture-well">Press a key or mouse button</div><p><kbd>Esc</kbd> cancels. The opening click is ignored.</p><div class="modal-actions">'+b('Cancel',"dialog=null;render()",'ghost')+'</div>';
 if(dialog.type==='conflict')modal='<h2>Binding already in use</h2><p><kbd>'+dialog.key+'</kbd> is assigned to <strong>'+bindings[dialog.clash.i][0]+'</strong>. Replace it with <strong>'+bindings[dialog.i][0]+'</strong>?</p><div class="modal-actions">'+b('Keep existing',"dialog=null;render()",'ghost')+b('Replace binding','replace()','primary')+'</div>';
 if(dialog.type==='unsaved')modal='<h2>Keep your changes?</h2><p>You have unapplied controls or display changes.</p><div class="modal-actions">'+b('Stay',"dialog=null;render()",'ghost')+b('Discard',"discard(dialog.target)",'ghost')+b('Save changes',"saveAndGo()",'primary')+'</div>';
 if(dialog.type==='reset')modal='<h2>Restore defaults?</h2><p>This resets the controls and display draft. Your saved preferences stay unchanged until you apply.</p><div class="modal-actions">'+b('Cancel',"dialog=null;render()",'ghost')+b('Restore defaults','restore()','primary')+'</div>';
 html+='<div class="modal-shade" role="dialog" aria-modal="true"><div class="modal">'+modal+'</div></div>';
 }
 app.innerHTML=html;
 const body=app.querySelector('.body');if(body)body.scrollTop=scroll;
 if(dialog){const modal=app.querySelector('.modal');modal.setAttribute('tabindex','-1');const focus=dialog.type==='capture'?modal:modal.querySelector('button');focus.focus({preventScroll:true})}
 else{
  const targetAction=resumeFocus||focusAction;
  const focusable=[...app.querySelectorAll('button,input')];
  const target=focusable.find(el=>targetAction&&el.getAttribute('onclick')===targetAction)||focusable.find(el=>focusLabel&&el.getAttribute('aria-label')===focusLabel);
  if(target){target.focus({preventScroll:true});if(caret&&target.classList.contains('search-input'))target.setSelectionRange(...caret)}
  resumeFocus=null;
 }
}
function details(){return '<div class="detail-preview">'+cube(selected,shape)+'</div><div><h3>Material</h3><h2 style="margin-top:6px">'+materials[selected][0]+'</h2><p class="identity mono">demo:'+materials[selected][0].toLowerCase()+'</p></div><div><h3 style="margin-bottom:9px">Shape</h3><div class="shapes">'+['Cube','Slab','Stairs','Post'].map(v=>b(v,"chooseShape('"+v+"')",shape===v?'selected':'')).join('')+'</div><p class="inspect-hint">'+(detailPinned?'Selection stays while you browse.':'Use ⋯ to pin an item and choose its Shape.')+'</p></div><div class="detail-actions">'+b('Assign to slot',"assigning=true;render()",'ghost')+b('Clear selection','clearSelection()','ghost')+'</div>'}
function updateDetail(){let el=document.getElementById('detail');if(el){const action=document.activeElement?.getAttribute('onclick');el.innerHTML=details();const target=[...el.querySelectorAll('button')].find(b=>action&&b.getAttribute('onclick')===action);if(target)target.focus({preventScroll:true})}}
function syncTiles(){app.querySelectorAll('.tile').forEach((tile,i)=>tile.classList.toggle('selected',Number(tile.dataset.material)===held))}
function preview(i){hovered=i;if(!detailPinned){selected=i;shape='Cube';updateDetail();syncTiles()}}
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('mousedown',e=>{if(dialog&&dialog.type==='capture'&&!e.target.closest('button')){e.preventDefault();chooseKey(['Left mouse','Middle mouse','Right mouse'][e.button]||('Mouse '+(e.button+1)))}});
document.addEventListener('keydown',e=>{
 if(dialog&&dialog.type==='capture'){e.preventDefault();if(e.key==='Escape'){dialog=null;render();return}if(['Shift','Control','Meta','Alt'].includes(e.key))return;let key=(e.ctrlKey?'Ctrl + ':'')+(e.metaKey?'Cmd + ':'')+(e.altKey?'Alt + ':'')+(e.shiftKey?'Shift + ':'')+(e.key===' '?'Space':e.key.length===1?e.key.toUpperCase():e.key);chooseKey(key);return}
 if(dialog&&e.key==='Tab'){const buttons=[...app.querySelectorAll('.modal button')];if(buttons.length){e.preventDefault();let index=buttons.indexOf(document.activeElement);index=(index+(e.shiftKey?-1:1)+buttons.length)%buttons.length;buttons[index].focus()}return}
 if(e.target.classList.contains('search-input')){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();if(searches[page])clearSearch();else e.target.blur()}return}
 if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(!dialog&&e.key==='/'&&['catalogue','bindings'].includes(page)){e.preventDefault();app.querySelector('.search-input')?.focus();return}
 if(e.key==='Escape'){e.preventDefault();if(dialog){dialog=null;render()}else nav('game')}
 if(!dialog&&page==='catalogue'&&/^[1-9]$/.test(e.key)){e.preventDefault();const n=Number(e.key)-1;if(hovered!==null)assign(n,hovered,hovered===selected?shape:'Cube');else slotClick(n);return}
 if(!dialog&&page==='catalogue'&&e.key.toLowerCase()==='x'){e.preventDefault();clearSelection();return}
 if(!dialog&&page!=='game'&&e.key==='Tab'){e.preventDefault();nav('game');return}
 if(!dialog&&e.key.toLowerCase()==='i'){e.preventDefault();nav(lastControls)}
 if(!dialog&&e.key==='Tab'&&page==='game'){e.preventDefault();page='catalogue';render()}
});
setAccent('leaf');render();
</script></body></html>
