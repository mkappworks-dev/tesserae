[package]
name = "tesserae"
description = "The Tesserae engine's Bevy application: rendering, input and the integrated server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Reloads a shader into the running app when its source file changes. Not on by
# default: it pulls in a filesystem watcher and resolves paths against the
# source tree, neither of which a shipped binary should do.
#
# bevy/file_watcher is deliberately absent. It watches an `assets/` directory,
# and there is none — nothing is loaded from disk yet, and where one ships is
# open until the look-pack API in step 9. Enabling it only logs two warnings.
dev = ["bevy/embedded_watcher"]

[dependencies]
bevy = "0.20.0"
# The version is not redundant with the path: a path dependency without one
# is unpublishable to crates.io, and cargo-deny counts it as a wildcard.
tesserae-core = { path = "../tesserae-core", version = "0.0.0" }
