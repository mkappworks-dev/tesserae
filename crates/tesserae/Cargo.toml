[package]
name = "tesserae"
description = "The Tesserae engine's Bevy application: rendering, input and the integrated server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Reloads shaders and assets into the running app when their source file
# changes. Not on by default: it pulls in a filesystem watcher and resolves
# paths against the source tree, neither of which a shipped binary should do.
#
# Both watchers, because the two halves live in different places: the engine's
# shaders are embedded in the binary as bevy_pbr's are, while everything else
# loads from the repo-root assets/.
dev = ["bevy/embedded_watcher", "bevy/file_watcher"]

profiling = ["dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }
bevy = { version = "0.20.0", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The version is not redundant with the path: a path dependency without one
# is unpublishable to crates.io, and cargo-deny counts it as a wildcard.
tesserae-core = { path = "../tesserae-core", version = "0.0.0" }
tesserae-mods = { path = "../tesserae-mods", version = "0.0.0" }
trash = "5"
