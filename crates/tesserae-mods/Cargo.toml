[package]
name = "tesserae-mods"
description = "Loads and runs Tesserae Mods: the WIT contract, the WASM sandbox and the Command queue. Depends on no engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tesserae-core = { path = "../tesserae-core", version = "0.0.0" }
wasmtime = { version = "49.0.4", default-features = false, features = [
  "runtime",
  "cranelift",
  "component-model",
  "async",
  "parallel-compilation",
  "std",
] }
wasmtime-wasi = { version = "49.0.4", default-features = false, features = ["p2"] }
bytes = "1"
dirs = "6"
rand_core = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Only `tokio::io::AsyncWrite`, which wasmtime-wasi's stream trait names; no runtime feature is enabled.
tokio = { version = "1", default-features = false }
toml = "1"

[[bench]]
name = "host_calls"
harness = false

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
futures-lite = "2.6.1"
# Process CPU time and the load average, for the benches' interleaved comparison.
libc = "0.2"
