# Every Declaration capability except the character's skin, which the tests
# splice in as pixels.
[[materials]]
name = "rock"
emission = 0
dimming = 15
occlusion = "opaque"
render = "opaque"
solid = true

[[materials]]
name = "water"
emission = 0
dimming = 2
occlusion = "same-material"
render = "blend"
solid = false
remove-time-s = 0.5

[[materials]]
name = "lava"
emission = 12
dimming = 2
occlusion = "never"
render = "blend"
solid = false

[[materials]]
name = "wood"
emission = 0
dimming = 15
occlusion = "same-material"
render = "cutout"
solid = true

[[materials]]
name = "ash"
emission = 0
dimming = 15
occlusion = "opaque"
render = "opaque"
solid = true

[[shapes]]
name = "slab"
boxes = [{ min = [0, 0, 0], max = [16, 8, 16] }]
collision = [{ min = [0, 0, 0], max = [16, 12, 16] }]

[[shapes]]
name = "fence"
boxes = [{ min = [6, 0, 6], max = [10, 16, 10] }]

[shapes.connect]
group = 1
connects-to = 3
to-sealed = true

[[shapes.connect.arms]]
face = 1
boxes = [{ min = [10, 4, 7], max = [16, 14, 9] }]
collision = [{ min = [10, -4, 6], max = [32, 24, 10] }]

[[shapes.connect.arms]]
face = 0
boxes = [{ min = [0, 4, 7], max = [6, 14, 9] }]

[[appearance]]
material = "rock"
color = [80, 90, 100, 255]

[[appearance]]
material = "water"
color = [30, 80, 200, 128]

[view]
view-distance-m = 160.0
lod-distance-m = 3000

[world]
sea-level-m = 20.0
relief-m = 12
feature-size-m = 48.0
soil-depth-m = 3.0
octaves = 4

[world.caves]
feature-size-m = 24.0
radius-m = 3.0
floor-m = 4.0
octaves = 2

[world.smoothing]
min-rise-m = 0.4

[world.water]
level-m = 24.0
material = "full:water"

[world.ground]
rock = "full:rock"
soil = "full:rock"
surface = "full:rock"

[world.movement]
allow-flight = true
allow-physics = true
start-in-flight = false

[[fluids]]
material = "full:water"
reach-m = 7.0
sideways-m-per-s = 4.0
downward-m-per-s = 8.0
recession-m-per-s = 4.0
reset-drop-m = 0.5
waterlogs = true
extinguishes = true

[[fluids]]
material = "full:lava"
reach-m = 3.0
sideways-m-per-s = 0.75
downward-m-per-s = 1.5
recession-m-per-s = 0.75
reset-drop-m = 0.5
waterlogs = false
extinguishes = false
heat = { strength = 12, reach-m = 2.0 }

[[reactions]]
consumed = "second"
product = "full:rock"
receiving = "first"
first = { fluid = "full:water", state = "any" }
second = { fluid = "full:lava", state = "source" }

[[combustion]]
fuel = "full:wood"
ignition-threshold = 6
ignition-delay-s = 2
emission = 12
heat = { strength = 10, reach-m = 2.0 }
end = { after = { seconds = 8.0, residue = "full:ash" } }

[[combustion]]
fuel = "full:ash"
ignition-threshold = 15
ignition-delay-s = 600
emission = 0
end = "permanent"

[[tools]]
name = "ruler"
kind = "measure"
