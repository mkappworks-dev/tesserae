[package]
name = "world-loader"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace root: the Tesserae workspace excludes this directory.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.62.0", default-features = false, features = ["macros", "realloc"] }
