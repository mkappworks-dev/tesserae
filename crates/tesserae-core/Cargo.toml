[package]
name = "tesserae-core"
description = "Chunk storage, world generation and meshing for Tesserae. Depends on no engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bench]]
name = "meshing"
harness = false

[[bench]]
name = "collide"
harness = false

[[bench]]
name = "lod"
harness = false

[[bench]]
name = "fluids"
harness = false

[[bench]]
name = "coarse_breakdown"
harness = false

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
