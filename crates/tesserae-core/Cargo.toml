[package]
name = "tesserae-core"
description = "Chunk storage, world generation and meshing for Tesserae. Depends on no engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bench]]
name = "meshing"
harness = false

[[bench]]
name = "collide"
harness = false

[[bench]]
name = "lod"
harness = false

[[bench]]
name = "fluids"
harness = false

[[bench]]
name = "entities"
harness = false

[[bench]]
name = "coarse_breakdown"
harness = false

[[bench]]
name = "relight"
harness = false

[[bench]]
name = "plants"
harness = false

[[bench]]
name = "structures"
harness = false

[[bench]]
name = "worldgen_v3"
harness = false

[dependencies]
base64 = "0.23"
flate2 = "1"
getrandom = "0.4"
# Pure Rust, so generation rounds alike on every platform, as the platform's own maths library
# need not. Pinned exactly: its answers are part of the Generator (ADR-0032).
libm = "=0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
# Four-wide noise. Pinned exactly: its floor and conversions are part of the Generator's bits, and
# its `mul_add` fuses on some targets only, so it is never called.
wide = "=1.7.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
