<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tesserae — World creation prototype</title>
    <link rel="icon" type="image/svg+xml" href="/brand.svg" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/refinements.css" />
    <link rel="stylesheet" href="/controls.css" />
    <link rel="stylesheet" href="/inventory.css" />
    <link rel="stylesheet" href="/layout-overlay.css" />
    <link rel="stylesheet" href="/hud.css" />
    <link rel="stylesheet" href="/polish.css" />
    <link rel="stylesheet" href="/survival.css" />
    <link rel="stylesheet" href="/crafting.css" />
    <link rel="stylesheet" href="/blocks.css" />
  </head>
  <body>
    <div class="prototype-bar">
      <span><b>TESSERAE</b> <span class="quiet">/ design study</span></span
      ><span class="direction-label">CINEMATIC</span
      ><label class="access-preview-control"
        >Your mode <span id="bar-mode"></span></label
      ><span id="bar-screen"></span>
    </div>
    <div id="game" class="game" data-skin="cinematic">
      <canvas id="landscape" aria-hidden="true"></canvas>
      <div class="shade"></div>
      <header class="game-header">
        <button class="brand" data-action="home" aria-label="Tesserae home">
          <img
            class="brand-symbol"
            src="/brand.svg"
            alt=""
            width="29"
            height="29"
          /><span class="brand-wordmark">Tesserae</span></button
        ><span class="edition">A WORLD OF YOUR OWN</span
        ><button
          class="icon-button"
          data-action="settings"
          aria-label="Open settings"
        >
          ⚙
        </button>
      </header>
      <main id="screen"></main>
      <footer class="game-footer">
        <span id="location">TERRA / THE GREENWOOD</span
        ><span
          ><kbd>Tab</kbd> Navigate <kbd>Enter</kbd> Select
          <kbd>Esc</kbd> Back</span
        ><span class="status-dot">LOCAL PROTOTYPE</span>
      </footer>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="notice-card" role="status" aria-live="polite"></div>
      <div id="pickup-feed" aria-live="polite"></div>
      <div id="dialog-root"></div>
    </div>
    <script src="/controls.js"></script>
    <script src="/settings.js"></script>
    <script src="/routes.js"></script>
    <script src="/interaction.js"></script>
    <script src="/layout-overlay.js"></script>
    <script src="/inventory.js"></script>
    <script src="/survival.js"></script>
    <script src="/crafting.js"></script>
    <script src="/blocks.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
