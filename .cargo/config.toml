[env]
# Bevy resolves its asset root as BEVY_ASSET_ROOT, else CARGO_MANIFEST_DIR, else
# the directory holding the executable. Under `cargo run -p tesserae` the middle
# one wins and points at crates/tesserae, which would put assets inside a
# BSL-licensed crate directory; assets are CC0. Pin it to the workspace root so
# the repo-root assets/ in docs/architecture.md is what dev actually loads.
#
# A shipped binary has neither variable set and falls through to its own
# directory, so it needs no configuration — only the release archive carrying
# assets/ beside the binary. Not forced, so an outer BEVY_ASSET_ROOT still wins.
BEVY_ASSET_ROOT = { value = ".", relative = true }
