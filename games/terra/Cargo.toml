[package]
name = "terra"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc"] }

[lints.clippy]
# ADR-0032 binds generation, and generation lives in tesserae-core.
disallowed_methods = "allow"
